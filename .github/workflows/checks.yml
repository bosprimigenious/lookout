name: Release
run-name: Release new ${{ inputs.bump }} version
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          VERSION=$(python3 scripts/release-version.py "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '### Release v%s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          args: --offline --no-exec --use-branch-tags --unreleased --tag v${{ steps.version.outputs.version }}
        env:
          RELEASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          OUTPUT: release-notes.md
      - name: Check release notes
        run: python3 scripts/check-release-notes.py "$RUNNER_TEMP/git-cliff/bin/git-cliff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: release-notes.md
          archive: false
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: prepare
    # GitHub validates permissions even for the skipped coverage-upload job.
    permissions:
      contents: read
      code-quality: write
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
  publish:
    name: Release new ${{ inputs.bump }} version ${{ needs.prepare.outputs.version }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-image.tar
          skip-decompress: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes.md
          skip-decompress: true
          digest-mismatch: error
      - name: Publish the tested image and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          docker load --input tested-image.tar
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' openruyi-lookout:test)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' openruyi-lookout:test)" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' openruyi-lookout:test)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "v$VERSION" --notes-file release-notes.md
          docker tag openruyi-lookout:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag openruyi-lookout:test "$IMAGE:v$VERSION"
          docker push "$IMAGE:v$VERSION"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for CHANNEL in main latest; do
            docker tag openruyi-lookout:test "$IMAGE:$CHANNEL"
            docker push "$IMAGE:$CHANNEL"
          done
